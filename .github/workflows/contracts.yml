name: contracts

on:
  push:
    paths:
      - "src/**"
      - "test/**"
      - "script/**"
      - "scripts/**"
      - ".storage-layout/**"
      - "foundry.toml"
      - ".github/workflows/contracts.yml"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Build
        run: forge build --sizes

      - name: Test
        run: forge test -vv

      - name: Storage layout gate
        run: ./scripts/check-storage-layout.sh
